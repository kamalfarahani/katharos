[tox]
min_version = 4.0
isolated_build = true
env_list = py313, py314, lint
skip_missing_interpreters = true

[testenv]
description = run tests
package = wheel
wheel_build_env = .pkg
deps =
    uv
set_env =
    HYPOTHESIS_PROFILE = ci
commands =
    uv run pytest --cov=katharos --cov-fail-under=80 {posargs}

[testenv:lint]
description = run linting with ruff
skip_install = true
deps =
    uv
    ruff
commands =
    uv run ruff check {posargs:src tests}
    uv run ruff format --check {posargs:src tests}

[testenv:typecheck]
description = run type checking with pyright
skip_install = true
deps =
    uv
    pyright
commands =
    uv run pyright {posargs:src}