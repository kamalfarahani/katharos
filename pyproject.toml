[project]
name = "katharos"
version = "1.4.1"
description = "A functional programming and concurrency library for Python: algebraic abstractions (Semigroups, Monoids, Functors, Applicatives, Monads), immutable data types, and message-passing concurrency (Go-style CSP today, more models planned) — all designed as composable, type-safe values."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Kamal", email = "kamal.farahani90@gmail.com" }
]
keywords = [
    "functional-programming",
    "functional",
    "monad",
    "monads",
    "functor",
    "applicative",
    "semigroup",
    "monoid",
    "maybe",
    "result",
    "either",
    "option",
    "io",
    "do-notation",
    "immutable",
    "type-safe",
    "concurrency",
    "csp",
    "channels",
    "message-passing",
    "structured-concurrency",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipython>=9.8.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "hypothesis>=6.0.0",
]
docs = [
    "sphinx>=7.2.0",
    "furo>=2024.1.0",
    "sphinx-autodoc-typehints>=2.0.0",
    "sphinx-copybutton>=0.5.0",
    "myst-parser>=2.0.0",
]
